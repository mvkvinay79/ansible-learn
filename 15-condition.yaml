- name: print os is redhat or not
  hosts: local
  connection: local
  tasks:
  - name: install nginx in redhad
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"
  - name: install nginx in debian
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"
