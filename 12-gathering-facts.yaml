- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg: "{{ ansible_facts}}"
  - name: print some info
    debug:
      msg: |
       OS family: {{ ansible_facts['os_family'] }}
       private_ip: {{ ansible_facts.default.ipv4.address }}
       private_ip2: {{ ansible_facts['default_ipv4'][address] }}
       timezone: {{ ansible_facts['date_time'] }}

