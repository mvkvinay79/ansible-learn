
---
- name: demo on filters
  hosts: local
  connection: local

  vars:
    topics: "Linux, Shell, Ansible, Terraform, Docker"
    names:
      - Sivakumar
      - Reddy
      - Mettukuru
    topic: ANSIBLE
    duration: "4"

  tasks:
    - name: print the name
      debug:
        msg: "Hi, {{ person_name | default('Ramesh') }}"

    - name: convert string to list
      debug:
        msg: "Topics are: {{ topics | split(',') | map('trim') | list }}"
