- name: course information
  hosts: local
  connection: local
  vars:
    course: "aiops with devsecops on aws"
    duration_in_hrs: 150
    is_live_session: true
    topics:
    - Linux
    - Terraform
    - Shell
    - Ansible
    more_details: 
      trainer: vinay
      months: 4
    exact_duration_in_months: 4.5
  tasks:
    - name: print info and type
      debug:
        msg: |
          name: "{{ course }} : {{ course | type_debug }}"
          duration: "{{ duration_in_hrs}} : {{ duration_in_hrs | type_debug}}"
          livesession: "{{ is_live_session}} : {{ is_live_session | type_debug}}"
          topic: "{{ topics }} : {{ topics | type_debug}}"
          more_details: "{{ more_details}} : {{ more_details | type_debug}}"